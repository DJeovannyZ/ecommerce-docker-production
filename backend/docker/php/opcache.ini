; =============================================================================
; OPcache - ajustes para una imagen inmutable
; =============================================================================
; validate_timestamps=0 asume que el codigo no cambia dentro del contenedor.
; Tras desplegar una imagen nueva se crea un contenedor nuevo, por lo que no
; hace falta que PHP revise mtimes en cada peticion.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
opcache.fast_shutdown = 1
