; =============================================================================
; PHP - configuracion base de produccion
; =============================================================================
expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 20M
upload_max_filesize = 20M
date.timezone = UTC
default_charset = "UTF-8"

; No revelar errores al cliente: Laravel ya devuelve JSON controlado.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
