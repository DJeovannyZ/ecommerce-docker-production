; =============================================================================
; Pool de PHP-FPM
; =============================================================================
; PHP-FPM escucha solo en loopback: Nginx es el unico punto de entrada y el
; puerto 9000 nunca se publica fuera del contenedor.
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Heredar las variables de entorno inyectadas por Docker Compose.
clear_env = no

access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
