; =============================================================================
; Supervisor - Nginx + PHP-FPM en el mismo contenedor
; =============================================================================
; Se mantienen dos procesos supervisados (proxy inverso + aplicacion). Un
; contenedor por servicio de negocio: la base de datos y el frontend viven en
; contenedores separados.
[supervisord]
nodaemon = true
user = root
pidfile = /run/supervisord.pid
logfile = /dev/null
logfile_maxbytes = 0

[program:php-fpm]
command = php-fpm -F
autorestart = true
startsecs = 2
priority = 5
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g 'daemon off;'
autorestart = true
startsecs = 2
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
